appId: com.hardwarelab.app
productName: HARDWARE LAB
copyright: Copyright © 2026 HARDWARE LAB
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - resources/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - resources/**
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  executableName: HARDWARE LAB
nsis:
  artifactName: HARDWARE_LAB_Setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: HARDWARE LAB
  runAfterFinish: true
  # Les données du joueur (%APPDATA%\HARDWARE LAB) ne sont jamais supprimées à la désinstallation.
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  uninstallDisplayName: HARDWARE LAB
publish:
  provider: github
  owner: banchetnolan2-hub
  repo: Hardware-labs
  releaseType: release
