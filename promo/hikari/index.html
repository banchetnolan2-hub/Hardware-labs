<style>
/* Layout: a single cinema stage, the 16:9 film centered, transport bar underneath. Single dark look on purpose (it's a screen). */
:root {
  --night: #0f0f2a;
  --panel: #1a1a3c;
  --mint: #a8f0a0;
  --amber: #ffb547;
  --blush: #ff8fb1;
  --snow: #f6f7ff;
  --mute: #9b9cc4;
  --display: "Dela Gothic One", "IPAGothic", "Inter", sans-serif;
  --body: "M PLUS Rounded 1c", "Inter", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--night); color: var(--snow); }
body {
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 32px;
}
.wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top h1 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; margin: 0; letter-spacing: .02em; }
.top h1 span { color: var(--amber); }
.top p { margin: 0; color: var(--mute); font-size: .9rem; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 14px; overflow: hidden; background: #000; box-shadow: 0 30px 80px -30px rgba(168, 240, 160, .25); }
canvas { display: block; width: 100%; height: 100%; }
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bar button {
  font: 800 .9rem var(--body); color: var(--night); background: var(--mint);
  border: 0; border-radius: 999px; padding: 9px 16px; cursor: pointer;
}
.bar button.ghost { background: transparent; color: var(--snow); box-shadow: inset 0 0 0 1.5px rgba(246, 247, 255, .3); }
.bar button:focus-visible, .bar input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.bar input[type=range] { flex: 1 1 200px; min-width: 0; accent-color: var(--mint); }
.time { font-variant-numeric: tabular-nums; color: var(--mute); font-size: .85rem; min-width: 84px; text-align: right; }
.note { color: var(--mute); font-size: .85rem; line-height: 1.55; max-width: 70ch; }
</style>

<div class="wrap">
  <div class="top">
    <h1>Hikari<span>光</span> · pub</h1>
    <p>50 s · 1920×1080 · musique générée</p>
  </div>
  <div class="stage"><canvas id="film" width="1920" height="1080"></canvas></div>
  <div class="bar">
    <button id="play" type="button">Pause</button>
    <button id="sound" class="ghost" type="button">Activer le son</button>
    <input id="seek" type="range" min="0" max="50" step="0.01" value="0" aria-label="Position dans la vidéo">
    <span class="time" id="time">0:00 / 0:50</span>
    <button id="full" class="ghost" type="button">Plein écran</button>
  </div>
  <p class="note">Clique sur « Activer le son » pour la musique. Les textes (lien d'invitation, salons, messages) se changent dans le bloc <code>SCRIPT</code> en haut du code.</p>
</div>

const W = 1920, H = 1080, DUR = 50;
const COL = { night: "#0f0f2a", panel: "#1a1a3c", mint: "#a8f0a0", amber: "#ffb547", blush: "#ff8fb1", snow: "#f6f7ff", red: "#f23f43" };
const DISPLAY = '"Dela Gothic One", "IPAGothic", "Inter", sans-serif';
const BODY = '"M PLUS Rounded 1c", "Inter", sans-serif';
const cv = document.getElementById("film");
const ctx = cv.getContext("2d");
const avatar = new Image(); avatar.src = AVATAR;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const elastic = x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * 2 * Math.PI / 3) + 1;
function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const font = (px, fam = DISPLAY, w = "") => { ctx.font = `${w} ${px}px ${fam}`.trim(); };

// ---------- precomputed particles ----------
const R = rng(7);
const stars = Array.from({ length: 140 }, () => ({ x: R() * W, y: R() * H, z: .2 + R() * .8, ph: R() * 6.28 }));
const swarm = Array.from({ length: 320 }, () => ({ a: R() * 6.28, r: 700 + R() * 900, s: 1 + R() * 3, c: [COL.mint, COL.amber, COL.snow][R() * 3 | 0], d: R() * .6 }));
const confetti = Array.from({ length: 180 }, () => { const a = R() * 6.28, v = 500 + R() * 1300; return { vx: Math.cos(a) * v, vy: Math.sin(a) * v - 400, r: R() * 6.28, vr: (R() - .5) * 14, c: [COL.mint, COL.amber, COL.blush, COL.snow][R() * 4 | 0], w: 10 + R() * 14 }; });
const sparks = Array.from({ length: 40 }, () => ({ a: R() * 6.28, r: 260 + R() * 420, sp: (R() - .5) * .6, s: 2 + R() * 4, ph: R() * 6.28 }));
const grain = document.createElement("canvas"); grain.width = grain.height = 256;
{ const g = grain.getContext("2d"), d = g.createImageData(256, 256); for (let i = 0; i < d.data.length; i += 4) { const v = R() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); }
const grainPat = ctx.createPattern(grain, "repeat");

// ---------- shared drawing helpers ----------
function background(t, tint = COL.night) {
  ctx.fillStyle = tint; ctx.fillRect(0, 0, W, H);
  const blob = (x, y, r, c, a) => { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, c); g.addColorStop(1, "rgba(0,0,0,0)"); ctx.globalAlpha = a; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.globalAlpha = 1; };
  blob(W * .25 + Math.sin(t * .3) * 200, H * .3 + Math.cos(t * .4) * 120, 700, COL.mint, .12);
  blob(W * .78 + Math.cos(t * .25) * 220, H * .75 + Math.sin(t * .35) * 140, 750, COL.amber, .1);
  for (const s of stars) {
    const x = ((s.x - t * 40 * s.z) % W + W) % W, y = s.y;
    ctx.globalAlpha = (.25 + .5 * (.5 + .5 * Math.sin(t * 2 + s.ph))) * s.z;
    ctx.fillStyle = COL.snow; ctx.fillRect(x, y, 2.4 * s.z, 2.4 * s.z);
  }
  ctx.globalAlpha = 1;
}
function finish(t) {
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.55)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = .045; ctx.globalCompositeOperation = "overlay";
  const ox = (t * 997) % 256, oy = (t * 613) % 256; ctx.translate(-ox, -oy);
  ctx.fillStyle = grainPat; ctx.fillRect(0, 0, W + 256, H + 256); ctx.restore();
}
function flash(t, at, len = .5, c = COL.snow) { if (t >= at && t < at + len) { ctx.globalAlpha = (1 - P(t, at, at + len)) * .9; ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; } }
// diagonal wipe: covers the screen in the first half, uncovers in the second
function wipe(t, t0, c, len = .6) {
  const k = P(t, t0, t0 + len); if (k <= 0 || k >= 1) return;
  const skew = 400, span = W + skew * 2;
  const a = k < .5 ? 0 : eio((k - .5) * 2) * span, b = k < .5 ? eio(k * 2) * span : span;
  ctx.fillStyle = c; ctx.beginPath();
  ctx.moveTo(a - skew, 0); ctx.lineTo(b, 0); ctx.lineTo(b - skew, H); ctx.lineTo(a - skew * 2, H); ctx.closePath(); ctx.fill();
}
function rays(t, n, c, a, rot = .15, cx = W / 2, cy = H / 2) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * rot); ctx.globalAlpha = a; ctx.fillStyle = c;
  for (let i = 0; i < n; i++) { const a0 = i / n * Math.PI * 2; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 2400, a0, a0 + Math.PI / n); ctx.closePath(); ctx.fill(); }
  ctx.restore(); ctx.globalAlpha = 1;
}
function shake(t, at, amp = 16) { const l = t - at; if (l < 0 || l > .5) return [0, 0]; const e = Math.exp(-l * 10) * amp; return [Math.sin(l * 90) * e, Math.cos(l * 77) * e]; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function wrapLines(text, maxW) { const words = text.split(" "), out = []; let line = ""; for (const w of words) { const test = line ? line + " " + w : w; if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; } else line = test; } out.push(line); return out; }

// ---------- scenes ----------
function sceneIntro(t) { // 0 – 5 : light gathers, 光 bursts
  background(t);
  const k = eio(P(t, 0, 3));
  ctx.globalCompositeOperation = "lighter";
  for (const s of swarm) {
    const kk = clamp((k - s.d * .3) / (1 - s.d * .3));
    if (t > 3.05) continue;
    const r = s.r * (1 - kk), a = s.a + kk * 2.2;
    const x = W / 2 + Math.cos(a) * r, y = H / 2 + Math.sin(a) * r * .6;
    ctx.globalAlpha = .3 + kk * .7; ctx.fillStyle = s.c;
    ctx.beginPath(); ctx.arc(x, y, s.s, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  if (t < 3.05) { const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 40 + k * 260); g.addColorStop(0, `rgba(255,255,240,${.2 + k * .8})`); g.addColorStop(1, "rgba(255,255,240,0)"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  if (t >= 3) {
    const l = t - 3, out = 1 - P(t, 4.6, 5.1);
    for (let i = 0; i < 3; i++) { const rk = eo(P(l, i * .12, 1.2 + i * .12)); ctx.globalAlpha = (1 - rk) * .8 * out; ctx.strokeStyle = i === 1 ? COL.amber : COL.mint; ctx.lineWidth = 10 - i * 3; ctx.beginPath(); ctx.arc(W / 2, H / 2, rk * 1100, 0, 7); ctx.stroke(); }
    const s = 1 + (1 - eo(P(l, 0, .8))) * 1.4;
    ctx.save(); ctx.translate(W / 2, H / 2 + 20); ctx.scale(s, s);
    ctx.globalAlpha = P(l, 0, .25) * out;
    font(460); ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.shadowColor = COL.mint; ctx.shadowBlur = 80; ctx.fillStyle = COL.snow; ctx.fillText(SCRIPT.kanji, 0, 0);
    ctx.shadowBlur = 0; ctx.restore(); ctx.globalAlpha = 1;
  }
  flash(t, 3, .7);
}

function sceneTitle(t) { // 5 – 10.3 : HIKARI letters drop
  background(t);
  const exitK = eio(P(t, 9.4, 10));
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(1 + exitK * .25, 1 + exitK * .25); ctx.translate(-W / 2, -H / 2);
  ctx.globalAlpha = 1 - exitK;
  font(250); ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
  const letters = SCRIPT.name.toUpperCase().split("");
  const widths = letters.map(c => ctx.measureText(c).width), gap = 14;
  font(230); const kw = ctx.measureText(SCRIPT.kanji).width; font(250);
  const total = widths.reduce((a, b) => a + b, 0) + gap * (letters.length - 1) + 40 + kw;
  let x = W / 2 - total / 2; const base = H / 2 + 60;
  letters.forEach((c, i) => {
    const lk = P(t, 5 + i * .1, 5.6 + i * .1);
    if (lk > 0) {
      const y = base - (1 - back(lk)) * 380, rot = (1 - lk) * (i % 2 ? .25 : -.25);

function sceneHooks(t) { // 10.3 – 17.3 : kinetic questions then the punch

function sceneFinal(t) { // 40 – 50 : the server card

  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;

  ctx.restore(); ctx.globalAlpha = 1;

    ctx.shadowColor = COL.mint; ctx.shadowBlur = 70; ctx.fillStyle = COL.panel; ctx.beginPath(); ctx.arc(0, 0, R0, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, R0 - 8, 0, 7); ctx.clip();
    if (avatar.complete && avatar.naturalWidth) ctx.drawImage(avatar, -R0, -R0, R0 * 2, R0 * 2);
    ctx.restore(); ctx.lineWidth = 8; ctx.strokeStyle = COL.snow; ctx.beginPath(); ctx.arc(0, 0, R0 - 4, 0, 7); ctx.stroke();
    // notification badge, a nod to the server icon
    const bk = P(t, 41.6, 42.2);

    const pulse = 1 + Math.max(0, Math.sin((t - 42) * Math.PI * 2)) * .035;
    ctx.save(); ctx.translate(cx, 880); ctx.scale(back(ck) * pulse, back(ck) * pulse);
    const bw = 600, bh = 104;
    rr(-bw / 2, -bh / 2, bw, bh, bh / 2); ctx.fillStyle = COL.mint; ctx.shadowColor = COL.mint; ctx.shadowBlur = 40; ctx.fill(); ctx.shadowBlur = 0;
    ctx.save(); ctx.clip(); const sx = ((t - 42.5) % 2.2) / 2.2 * (bw + 400) - bw / 2 - 200;
    const g = ctx.createLinearGradient(sx - 80, 0, sx + 80, 0); g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(.5, "rgba(255,255,255,.7)"); g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g; ctx.fillRect(-bw / 2, -bh / 2, bw, bh); ctx.restore();
    font(50); ctx.fillStyle = COL.night; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(SCRIPT.cta, 0, 4);
    ctx.restore();

}

function draw(t) {
  ctx.save();
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  if (t < 5) sceneIntro(t);
  else if (t < 10.3) sceneTitle(t);
  else if (t < 17.3) sceneHooks(t);
  else if (t < 27.6) sceneFeatures(t);
  else if (t < 35) sceneChat(t);
  else if (t < 40) sceneRush(t);
  else sceneFinal(t);
  ctx.restore();
  wipe(t, 9.9, COL.mint);
  wipe(t, 17.0, COL.blush);
  wipe(t, 27.3, COL.amber);
  finish(t);
}

// ---------- music (synthesized, 120 BPM, one beat = 0.5 s) ----------
async function renderMusic(rate = 44100) {
  const ac = new OfflineAudioContext(2, rate * DUR, rate);
  const master = ac.createGain(); master.gain.value = .55;
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
  master.connect(comp); comp.connect(ac.destination);
  const noiseBuf = ac.createBuffer(1, rate * 2, rate); { const d = noiseBuf.getChannelData(0); const r = rng(3); for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1; }
  const noise = (t, dur, type, freq, gain, q = 1) => { const s = ac.createBufferSource(); s.buffer = noiseBuf; const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q; const g = ac.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + .05); };
  const kick = (t, v = 1) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(42, t + .14); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + .42); o.connect(g); g.connect(master); o.start(t); o.stop(t + .45); };
  const hat = t => noise(t, .05, "highpass", 8000, .22);
  const clap = t => { noise(t, .2, "bandpass", 1600, .7, .8); noise(t + .012, .16, "bandpass", 1900, .4, .8); };
  const tone = (t, f, dur, type, gain, cut, att = .01) => { const o = ac.createOscillator(), fl = ac.createBiquadFilter(), g = ac.createGain(); o.type = type; o.frequency.value = f; fl.type = "lowpass"; fl.frequency.value = cut; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + att); g.gain.setValueAtTime(gain, t + Math.max(att, dur - .08)); g.gain.linearRampToValueAtTime(0, t + dur); o.connect(fl); fl.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02); };
  const impact = t => { kick(t, 1.2); tone(t, 48, 1.6, "sine", .6, 200, .005); noise(t, 1.4, "highpass", 3000, .35); };
  const riser = (t0, t1, peak = .3) => { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true; const f = ac.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 3; f.frequency.setValueAtTime(300, t0); f.frequency.exponentialRampToValueAtTime(7000, t1); const g = ac.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(peak, t1); g.gain.linearRampToValueAtTime(0, t1 + .02); s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t1 + .05); };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const chords = [[53, [65, 69, 72, 76]], [55, [67, 71, 74, 79]], [52, [64, 67, 71, 74]], [57, [69, 72, 76, 79]]]; // F G Em Am
  const chordAt = t => chords[Math.floor(Math.max(0, t - 3) / 2) % 4];
  const pad = (t, dur, gain = .035) => { const [, notes] = chordAt(t + .01); for (const m of notes) for (const det of [-6, 6]) { const f = hz(m - 12) * Math.pow(2, det / 1200); tone(t, f, dur, "sawtooth", gain, 1400, .25); } };
  const bassBar = (t, pattern) => { const [root] = chordAt(t + .01); pattern.forEach((on, k) => on && tone(t + k * .25, hz(root - 12), .22, "sawtooth", .32, 520)); };
  const lead = (t, notes) => notes.forEach(([dt, m, d]) => tone(t + dt, hz(m), d, "square", .05, 2600));

  // intro
  tone(0, hz(45), 3, "sine", .25, 300, 1.5); pad(0, 3.0, .025); riser(.5, 3, .25);
  impact(3);
  // groove: title section
  const groove = (a, b, opts = {}) => {
    for (let t = a; t < b - .001; t += .5) {
      const beat = Math.round((t - 3) / .5);
      kick(t, .9); hat(t + .25);
      if (opts.clap && beat % 2 === 1) clap(t);
      if (beat % 4 === 0) { pad(t, 2, opts.padGain ?? .03); bassBar(t, [1, 0, 1, 1, 0, 1, 1, 0]); }
    }
  };
  groove(3, 10);
  riser(9.5, 10.5, .2);
  // hooks: tense, hits on each phrase
  for (const s of [10.5, 12, 13.5]) { impact(s); clap(s + .25); for (let t = s + .5; t < s + 1.5; t += .5) kick(t, .6); }
  riser(13.5, 15, .35);
  impact(15);
  groove(15, 34.5, { clap: true });
